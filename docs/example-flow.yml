fluxo:
  id: "criar-pedido-v1"
  descricao: "Fluxo de criação de pedido"
  versao: "1.0.0"
  ativo: true

  contrato:
    campos:
      - nome: "clienteId"
        tipo: STRING
        obrigatorio: true
        validacoes:
          - tipo: NOT_BLANK
          - tipo: PATTERN
            valor: "^[A-Z0-9]{6,20}$"
            mensagem: "clienteId inválido"
      - nome: "valor"
        tipo: DECIMAL
        obrigatorio: true
        validacoes:
          - tipo: POSITIVE

  integracoes:
    - id: "validar-cliente"
      ordem: 1
      tipo: HTTP
      continuarEmErro: false
      http:
        # Em dev/local, "api.exemplo.com" resolve para o container WireMock
        # via alias da rede `portal` em docker-compose-service-portal.yml.
        url: "http://api.exemplo.com/clientes/{{contrato.clienteId}}"
        metodo: GET
        headers:
          Content-Type: "application/json"
        timeout: 5000

    - id: "salvar-pedido"
      ordem: 2
      tipo: DATABASE
      continuarEmErro: false
      database:
        operacao: INSERT
        colecao: "pedidos"
        documentoTemplate: |
          {"clienteId":"{{contrato.clienteId}}","valor":"{{contrato.valor}}","status":"CRIADO"}
        mapeamentoResposta:
          campoDestino: "pedidoId"
          campoOrigem: "_id"

    - id: "notificar-rabbit"
      ordem: 3
      tipo: QUEUE
      provider: RABBITMQ
      continuarEmErro: true
      queue:
        exchange: "pedidos.exchange"
        routingKey: "pedido.criado"
        mensagemTemplate: |
          {"evento":"PEDIDO_CRIADO","pedidoId":"{{integracoes.salvar-pedido.pedidoId}}"}
        persistente: true

    - id: "notificar-kafka"
      ordem: 4
      tipo: QUEUE
      provider: KAFKA
      continuarEmErro: true
      queue:
        topic: "pedidos.criados"
        mensagemTemplate: |
          {"pedidoId":"{{integracoes.salvar-pedido.pedidoId}}"}

    - id: "notificar-sqs"
      ordem: 5
      tipo: QUEUE
      provider: SQS
      continuarEmErro: true
      queue:
        queueUrl: "https://sqs.us-east-1.amazonaws.com/123/pedidos"
        mensagemTemplate: |
          {"pedidoId":"{{integracoes.salvar-pedido.pedidoId}}"}
