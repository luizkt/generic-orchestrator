name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, Spotless, testes e gate JaCoCo
        run: |
          chmod +x ./gradlew
          ./gradlew build jacocoTestCoverageVerification --no-daemon

      - name: Relatórios de teste (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests
          if-no-files-found: ignore

  agents-index:
    name: índice AGENTS.md
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: repo-index.py check
        run: python3 .claude/skills/update-agents-index/repo-index.py check .
