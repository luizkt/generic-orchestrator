name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, Spotless, testes e gate JaCoCo
        run: |
          chmod +x ./gradlew
          ./gradlew build jacocoTestCoverageVerification --no-daemon

      - name: Relatórios de teste (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests
          if-no-files-found: ignore

  agents-index:
    name: índice AGENTS.md
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: repo-index.py check
        run: python3 .claude/skills/update-agents-index/repo-index.py check .

  open-pr:
    name: abrir PR para main
    needs: [build, agents-index]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
    steps:
      - name: Abrir PR para main, se ainda não existir
        run: |
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "PR já aberto para $BRANCH."
            exit 0
          fi
          title=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          {
            printf '%s\n\n' "PR aberto automaticamente pelo CI depois de build e testes verdes em \`$BRANCH\`."
            printf '%s\n\n' "Último commit:"
            printf '%s\n' "$COMMIT_MSG"
          } > body.md
          if ! gh pr create --base main --head "$BRANCH" --title "$title" --body-file body.md; then
            echo "::warning::Não foi possível abrir o PR. Verifique em Settings > Actions > General se 'Allow GitHub Actions to create and approve pull requests' está habilitado."
          fi
